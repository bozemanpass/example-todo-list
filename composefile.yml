services:
  backend:
    image: bozemanpass/todo-backend:stack
    ports:
      - "5000:5000" # @stack http-proxy /api/todos
    environment:
      # The node-service wrapper defaults to node's conventional port 3000; this
      # keeps the service on 5000, which is what clients of this API expect.
      STACK_LISTEN_PORT: 5000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: todoapp
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: bozemanpass/todo-frontend:stack
    environment:
      # Substituted into the built assets at container start by the wrapper;
      # see frontend/.env.production.
      API_URL: ${API_URL:-http://localhost:5000}
      # The webapp wrapper serves on port 80 by default; move it to 3000 so the
      # host and container ports agree.  A mismatched mapping ("3000:80") does
      # not survive the '*-same' --map-ports-to-host recipes, which key off the
      # container port and would silently republish this on port 80.
      STACK_LISTEN_PORT: 3000
    ports:
      - "3000:3000" # @stack http-proxy /

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todoapp
    entrypoint: bash
    command: -c  'usermod -u ${STACK_HOST_UID:-1000} postgres;groupmod -g ${STACK_HOST_GID:-1000} postgres;exec /usr/local/bin/docker-entrypoint.sh postgres -c log_statement=all -c log_destination=stderr'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

