name: Update Locks

# Regenerate the stack.lock pins at current upstream state -- the wrapper repo
# commits and the external image digests (postgres) -- validate them by
# building, then commit and push.  This is the only sanctioned way lock
# updates happen: delete and regenerate, never hand-edit.

on:
  workflow_dispatch:
  # Uncomment to also ingest upstream changes on a schedule:
  # schedule:
  #   - cron: '0 9 * * 1'

concurrency: update-locks

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STACK_DIR: stacks/todo
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stack
        run: |
          mkdir -p $HOME/bin
          curl -L -o $HOME/bin/stack https://github.com/bozemanpass/stack/releases/latest/download/stack
          chmod +x $HOME/bin/stack
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Regenerate locks (the build validates the new pins)
        run: |
          rm -f $STACK_DIR/stack.lock
          stack prepare --stack ./$STACK_DIR

      - name: Commit and push if the locks changed
        run: |
          if [ -n "$(git status --porcelain $STACK_DIR/stack.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $STACK_DIR/stack.lock
            git commit -m "Update stack.lock"
            git push
          else
            echo "Locks unchanged; nothing to do."
          fi
