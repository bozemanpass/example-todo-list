name: todo
description: "Todo"
containers:
  # The frontend has no container build of its own: the 'webapp' wrapper builds
  # the Vite app and serves the result as static content.
  - name: bozemanpass/todo-frontend
    wrapper: webapp
    content-root: frontend
  # The backend is a long-running node service, not static content, so it uses the
  # 'node-service' wrapper rather than 'webapp'.
  - name: bozemanpass/todo-backend
    wrapper: node-service
    content-root: backend
pods:
  - name: todo-list
    path: .
# The database password is a declared secret: a value is generated at deploy time and
# injected into every container, so the backend and the database agree on it without it
# being written anywhere.  The backend reads the same POSTGRES_PASSWORD name the
# postgres image does (see backend/src/database/index.ts).
secrets:
  POSTGRES_PASSWORD:
