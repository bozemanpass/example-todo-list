name: todo
description: "Todo"
containers:
  # The frontend has no container build of its own: the 'webapp' wrapper builds
  # the Vite app and serves the result as static content.
  - name: bozemanpass/todo-frontend
    wrapper: webapp
    content-root: frontend
  # The backend is a long-running node service, not static content, so it uses the
  # 'node-service' wrapper rather than 'webapp'.
  - name: bozemanpass/todo-backend
    wrapper: node-service
    content-root: backend
pods:
  - name: todo-list
    path: .
